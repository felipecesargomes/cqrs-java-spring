<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>

  <text x="40" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">CQRS - Separacao entre Escrita e Leitura</text>
  <text x="40" y="78" font-family="Arial, sans-serif" font-size="16" fill="#374151">Projeto Spring Boot com modulo command (write) e modulo query (read)</text>

  <rect x="40" y="120" width="180" height="70" rx="10" ry="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="130" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Cliente / API</text>
  <text x="130" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">HTTP Request</text>

  <rect x="290" y="120" width="210" height="70" rx="10" ry="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="395" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Controller</text>
  <text x="395" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">/api/v1/products, /reviews</text>

  <rect x="560" y="120" width="180" height="70" rx="10" ry="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="650" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">CommandBus</text>
  <text x="650" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Roteamento</text>

  <rect x="790" y="120" width="250" height="70" rx="10" ry="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="915" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">CommandHandler</text>
  <text x="915" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">CreateProduct / CreateReview</text>

  <rect x="790" y="240" width="250" height="70" rx="10" ry="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="915" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Repository</text>
  <text x="915" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Spring Data JPA</text>

  <rect x="790" y="360" width="250" height="70" rx="10" ry="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="915" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Write Database</text>
  <text x="915" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">MySQL</text>

  <rect x="420" y="360" width="240" height="70" rx="10" ry="10" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="540" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Read Model</text>
  <text x="540" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Visoes para consulta</text>

  <rect x="130" y="360" width="220" height="70" rx="10" ry="10" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="240" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Query API</text>
  <text x="240" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Modulo query</text>

  <line x1="220" y1="155" x2="290" y2="155" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="155" x2="560" y2="155" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="155" x2="790" y2="155" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="915" y1="190" x2="915" y2="240" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="915" y1="310" x2="915" y2="360" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="790" y1="395" x2="660" y2="395" stroke="#374151" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <line x1="420" y1="395" x2="350" y2="395" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="360" x2="240" y2="190" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="700" y="375" font-family="Arial, sans-serif" font-size="13" fill="#374151">projecao / sincronizacao</text>
  <text x="255" y="270" font-family="Arial, sans-serif" font-size="13" fill="#374151">consultas</text>

  <rect x="40" y="455" width="1120" height="45" rx="10" ry="10" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="60" y="483" font-family="Arial, sans-serif" font-size="13" fill="#374151">Ideia central: comandos alteram estado na trilha de escrita; consultas leem um modelo dedicado na trilha de leitura.</text>
</svg>


